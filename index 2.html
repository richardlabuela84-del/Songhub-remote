<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#111"><link rel="manifest" href="manifest.json"><title>SongHub Karaoke</title><style>
*{box-sizing:border-box}body{margin:0;background:#0b0b0f;color:#fff;font-family:-apple-system,BlinkMacSystemFont,sans-serif}header{padding:20px 16px 10px;position:sticky;top:0;background:#0b0b0fee;z-index:2}h1{margin:0}.sub,.muted{color:#999;font-size:13px}main{padding:12px 16px 175px;max-width:760px;margin:auto}.panel{background:#15151b;border:1px solid #292932;border-radius:18px;padding:14px;margin:10px 0}input{width:100%;padding:12px;border-radius:12px;border:1px solid #333;background:#0e0e13;color:#fff}.song{padding:13px;border-radius:12px;background:#1b1b22;margin:8px 0}.song small{color:#999}#lyrics{height:310px;overflow:auto;text-align:center;padding:100px 15px}.line{color:#777;font-size:18px;padding:10px}.active{color:#fff;font-size:25px;font-weight:700}.controls{position:fixed;bottom:0;left:0;right:0;background:#111118ee;padding:12px 16px calc(12px + env(safe-area-inset-bottom));border-top:1px solid #292932}.row{display:flex;gap:9px;align-items:center}.row>*{flex:1}button{border:0;border-radius:14px;padding:11px;background:#292932;color:#fff;font-size:18px}</style></head><body>
<header><h1>🎤 SongHub Karaoke</h1><div class="sub">Standalone music + synchronized lyrics</div></header><main>
<div class="panel"><b>Add your songs</b><p class="muted">Choose audio files and matching .lrc lyric files.</p><input id="audioFiles" type="file" accept="audio/*" multiple><br><br><input id="lrcFiles" type="file" accept=".lrc,text/plain" multiple></div>
<div class="panel"><input id="search" placeholder="🔎 Search songs"><div id="songs"></div></div>
<div class="panel"><b id="now">No song selected</b><div id="lyrics"><div class="muted">Add a song and LRC lyrics to start.</div></div></div></main>
<div class="controls"><div class="row"><button onclick="prev()">⏮</button><button onclick="toggle()">▶️</button><button onclick="next()">⏭</button><span id="time">0:00 / 0:00</span></div><input id="progress" type="range" min="0" max="1000" value="0"><div class="row"><span class="muted">🔊 Volume</span><input id="volume" type="range" min="0" max="1" step=".01" value="1"></div></div>
<audio id="audio"></audio><script>
const audio=document.getElementById('audio'),songsEl=document.getElementById('songs'),lyricsEl=document.getElementById('lyrics');let songs=[],current=-1,lyrics=[];
function esc(x){return x.replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]) )}
function parseLRC(t){let a=[];t.split(/\r?\n/).forEach(x=>{let tags=[...x.matchAll(/\[(\d+):(\d+(?:\.\d+)?)\]/g)],text=x.replace(/\[\d+:\d+(?:\.\d+)?\]/g,'').trim();tags.forEach(m=>a.push({time:+m[1]*60 + +m[2],text}))});return a.sort((a,b)=>a.time-b.time)}
function render(){let q=document.getElementById('search').value.toLowerCase();songsEl.innerHTML=songs.map((s,i)=>({s,i})).filter(x=>x.s.name.toLowerCase().includes(q)).map(x=>`<div class="song" onclick="select(${x.i})"><b>${esc(x.s.name)}</b><br><small>${x.s.lrc.length?'🎤 Lyrics ready':'🎵 Audio only'}</small></div>`).join('')||'<span class="muted">No songs yet.</span>'}
document.getElementById('audioFiles').onchange=e=>{[...e.target.files].forEach(f=>songs.push({name:f.name.replace(/\.[^.]+$/,''),file:f,lrc:[]}));render();if(current<0&&songs.length)select(0)};
document.getElementById('lrcFiles').onchange=e=>{[...e.target.files].forEach(f=>{let base=f.name.replace(/\.lrc$/i,'').toLowerCase(),s=songs.find(x=>x.name.toLowerCase()===base);if(s){let r=new FileReader();r.onload=()=>{s.lrc=parseLRC(r.result);if(s===songs[current]){lyrics=s.lrc;showLyrics()}};r.readAsText(f)}});render()};
function select(i){current=i;let s=songs[i];audio.src=URL.createObjectURL(s.file);audio.play().catch(()=>{});lyrics=s.lrc;document.getElementById('now').textContent=s.name;showLyrics();render()}
function showLyrics(){lyricsEl.innerHTML=lyrics.length?lyrics.map((l,i)=>`<div class="line" id="l${i}">${esc(l.text)}</div>`).join(''):'<div class="muted">No synchronized .lrc lyrics loaded.</div>'}
function toggle(){if(current<0)return;audio.paused?audio.play():audio.pause()}function prev(){if(songs.length)select((current-1+songs.length)%songs.length)}function next(){if(songs.length)select((current+1)%songs.length)}
audio.onended=next;audio.ontimeupdate=()=>{document.getElementById('progress').value=audio.duration?audio.currentTime/audio.duration*1000:0;document.getElementById('time').textContent=Math.floor(audio.currentTime/60)+':'+String(Math.floor(audio.currentTime%60)).padStart(2,'0')+' / '+(audio.duration?Math.floor(audio.duration/60)+':'+String(Math.floor(audio.duration%60)).padStart(2,'0'):'0:00');let n=-1;lyrics.forEach((l,i)=>{if(l.time<=audio.currentTime)n=i});document.querySelectorAll('.line').forEach((e,i)=>e.classList.toggle('active',i===n));if(n>=0)document.getElementById('l'+n)?.scrollIntoView({behavior:'smooth',block:'center'})};
document.getElementById('progress').oninput=e=>{if(audio.duration)audio.currentTime=e.target.value/1000*audio.duration};document.getElementById('volume').oninput=e=>audio.volume=e.target.value;document.getElementById('search').oninput=render;render();
</script></body></html>
